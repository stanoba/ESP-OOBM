[platformio]
default_envs = esp32_pico_d4

[env:esp32_pico_d4]
platform = espressif32 @ ^6.12.0
board = pico32
framework = arduino
board_build.partitions = partitions_custom.csv
monitor_speed = 115200
upload_speed = 921600
monitor_filters = time, esp32_exception_decoder

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D SERIAL_RX_BUFFER_SIZE=4096
    -D WEBSOCKETS_NETWORK_TYPE=NETWORK_ESP32
    -Os
    -std=gnu++17

lib_deps =
    links2004/WebSockets @ ^2.4.1

; Host-side unit tests (no hardware needed):  pio test -e native
[env:native]
platform = native
test_framework = unity
extra_scripts = pre:test_env_path.py
platform_packages =
    toolchain-gccmingw32
build_flags =
    -std=gnu++17
    -I test/include
    -I include
