name: CI & Unit Tests

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'software/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'software/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  test_and_build:
    name: Unit Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO & Dependencies
        run: |
          pip install -U platformio esptool

      - name: Cache PlatformIO Core & Packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('software/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Run Host Unit Tests
        working-directory: software
        run: |
          pio test -e native

      - name: Compile ESP32-PICO-D4 Firmware
        working-directory: software
        run: |
          pio run -e esp32_pico_d4
