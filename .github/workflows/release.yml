name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO & esptool
        run: |
          pip install -U platformio esptool

      - name: Cache PlatformIO Core & Packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('software/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building release for tag: $TAG"

      - name: Run Host Unit Tests
        working-directory: software
        run: |
          pio test -e native

      - name: Compile ESP32-PICO-D4 Firmware
        working-directory: software
        run: |
          pio run -e esp32_pico_d4

      - name: Package Release Binaries
        working-directory: software
        run: |
          python package_release.py "${{ steps.get_version.outputs.tag }}"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "ESP-OOBM ${{ steps.get_version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            software/dist/esp-oobm-*.bin
            software/dist/esp-oobm-*.txt
